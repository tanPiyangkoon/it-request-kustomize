apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-request
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-request
  template:
    metadata:
      labels:
        app: it-request
    spec:
      containers:
      - name: it-request
        image: tanpiyangkoon/it-request  
        ports:
        - containerPort: 3001
          name: http
        envFrom:
        - configMapRef:
            name: it-request-config
        - secretRef:
            name: it-request-secret
        livenessProbe:
          httpGet:
            path: /health  # หรือ endpoint ที่ backend support
            port: 3001
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: it-request-backend-service
spec:
  selector:
    app: it-request-backend
  ports:
  - port: 3001
    targetPort: 3001
    